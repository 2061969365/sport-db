<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fc4c02" />
<meta name="description" content="运动库 SportDB — 运动健康问答：经 Bot 服务走 Agent（工具+记忆）" />
<title>聊天 · 运动库 SportDB</title>
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./chat.css" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">💬</span>
    <div>
      <h1>运动聊天 <span class="en">SportDB Bot</span></h1>
      <p class="subtitle">经 Bot 服务走 Agent（工具+记忆+规则，和 TG 里同一个）</p>
    </div>
  </div>
  <a class="back" href="./index.html">← 返回首页</a>
</header>

<main class="chat-main">
  <details class="card settings">
    <summary>⚙️ Bot 服务设置（点击展开）</summary>
    <label>Bot 服务地址
      <input id="cfg-endpoint" type="url" placeholder="https://sport-db-bot.<账号>.workers.dev" autocomplete="off" />
    </label>
    <label>本机会话 ID（服务端同样记忆，清空即换身份）
      <input id="cfg-model" type="text" readonly autocomplete="off" />
    </label>
    <div class="row">
      <button id="btn-save-cfg" type="button">保存设置</button>
      <button id="btn-clear" type="button" class="ghost">清空聊天记录</button>
    </div>
    <p class="hint" id="cfg-hint"></p>
  </details>

  <div class="card summary-card">
    <h2>📊 近30天摘要 <small class="tag">发送时自动拼接</small></h2>
    <pre id="chat-summary" class="summary">正在汇总本地数据…</pre>
  </div>

  <div class="card chat-card">
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="问问你的训练情况…（如：我最近跑量怎么样？）" autocomplete="off" maxlength="500" />
      <button id="btn-send" type="submit">发送</button>
    </form>
    <p class="hint">记录存本机；服务端按会话 ID 独立记忆。每小时 60 轮限流。</p>
  </div>
</main>

<script src="./chat.js"></script>
</body>
</html>
