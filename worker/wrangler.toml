# sport-db Bot桥 Worker 配置

name = "sport-db-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

# 无依赖：零 npm 包，`wrangler deploy` 直接发布。
# 免费计划注意：Workers 每天 10 万次请求内免费，本 Bot 问答量远低于此。

[vars]
# 公开仓库 morningsong/sport-db（按实际改），分支 main。
# Bot 从 raw.githubusercontent.com 拉 data/workouts/<年>.csv + data/daily/<年>.csv。
REPO = "OWNER/sport-db"
# 免 Key 网关（不设 max_tokens）。默认模型按任务要求：
VISION_ENDPOINT = "https://gateway.example.com/v1/chat/completions"
VISION_MODEL = "muse-spark-1.3-contributor-free"

# ---- 密钥（绝不写进本文件，用 wrangler secret put 设置）----
# TG_BOT_TOKEN      Telegram @BotFather 给的 token
# TG_SECRET         自定义 webhook 校验串（任意随机字符串）
# FEISHU_APP_ID     飞书开放平台应用 App ID
# FEISHU_APP_SECRET 飞书开放平台应用 App Secret
