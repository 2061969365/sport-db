# sport-db Bot桥 Worker 配置

name = "sport-db-bot"
main = "src/server.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
class_name = "SportDbAgent"
name = "SportDbAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SportDbAgent"]

# 依赖见 package.json（Agents SDK + Think harness），`npx wrangler deploy` 发布。
# 免费计划注意：Workers 每天 10 万次请求内免费，本 Bot 问答量远低于此。

[vars]
# 公开仓库 2061969365/sport-db，分支 main。
# Bot 从 GitHub Contents API 读写 data/workouts/<年>.csv + data/daily/<年>.csv。
REPO = "2061969365/sport-db"
# 免 Key 网关（2026-10-27 从 apius2.fastfaster.kdns.fr 换到 zen.uflash.ccwu.cc）。
# 运行时配置存在数据仓 config/model.json（/model 命令改），这里只是「默认值」，
# 即 /model reset 的落点；两边保持一致，免得重置后回到旧网关。
# 换模型/网关前务必 /model test 或 /model <名>（会自动体检：对话/工具/读图）。
VISION_ENDPOINT = "https://zen.uflash.ccwu.cc/v1/chat/completions"
VISION_MODEL = "deepseek-v4.1-flash-free"
# 流式：打开（与 DSH 直连该网关的行为一致）。
# 历史教训：之前判断"流式坏了"其实是 reasoning_effort=xhigh 不被上游支持造成的假象；
# 改成 high 之后流式可用。若再遇到断流，把它设成 "off" 走非流式+合成 SSE。
MODEL_STREAMING = "on"
# 鉴权头：该网关只认"有没有 Authorization"，值无所谓（DSH 那边配的就是假 key "1"）。
# 不带头会走匿名小额度，容易被限流，所以默认带上。
VISION_API_KEY = "1"
# 网关暂停：2026-10-28 起暂停（zen 额度/稳定性不可控，apius2 已 429）。
# 置 "1" = 不调用模型：聊天回维护提示、截图只存不识别（进 review，恢复后自动补录）。
# 选好新网关后删掉这行（或设 "0"）再 deploy 即恢复。
GATEWAY_PAUSED = "1"
# 备用网关：**已停用**（2026-10-27 起 apius2 对免费模型一律 429，配了只会白打一次请求）。
# 要用就填这两项，代码里的兜底逻辑仍然保留。
# VISION_ENDPOINT_ALT = "https://apius2.fastfaster.kdns.fr/v1/chat/completions"
# VISION_MODEL_ALT = "deepseek-v4.1-flash-free"
# 天气工具默认城市（留空 / 删掉则让用户每次说城市）。也可改用 HOME_LAT/HOME_LON。
# HOME_CITY = "上海"

# ---- 密钥（绝不写进本文件，用 wrangler secret put 设置）----
# TG_BOT_TOKEN      Telegram @BotFather 给的 token
# TG_SECRET         自定义 webhook 校验串（任意随机字符串）
# GH_PAT            细粒度 PAT，仅该仓 Contents 读写（不配则只读）
# FEISHU_APP_ID     飞书开放平台应用 App ID
# FEISHU_APP_SECRET 飞书开放平台应用 App Secret
# TAVILY_API_KEY    可选：配了走 Tavily 搜索（不配走免 Key 的 DuckDuckGo）
