# SportDB Pages 预览发布：把 frontend/ 静态发布到 GitHub Pages。
# 仓库根就是 sport-db（checkout 根 = 本仓根），以下路径均为相对仓根。
# 数据捆绑：发布前把 data.db + data/workouts/*.csv 拷贝进 frontend/，
# 对应 app.js 的候选地址 ./data.db 与 ./data/workouts/<年>.csv（CSV 降级用）。
name: pages-preview

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data.db'
      - 'data/workouts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 捆绑 data.db 与 workouts CSV
        run: |
          cp data.db frontend/data.db
          mkdir -p frontend/data/workouts
          cp data/workouts/*.csv frontend/data/workouts/
          ls -lh frontend/data.db frontend/data/workouts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
