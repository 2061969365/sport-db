# SportDB Pages 预览发布（占位）：把 sport-db/frontend 静态发布到 GitHub Pages
# 生效条件：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
# data.db 接入后：在 upload-pages-artifact 前加一步把 data/data.db 拷贝进 frontend/data/。
name: pages-preview

on:
  push:
    branches: [main]
    paths:
      - 'sport-db/frontend/**'
      - '.github/workflows/pages.yml'
      - 'sport-db/.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(data.db): 取消注释，把 SQLite 沿 httpvfs 需要的文件一起发布
      # - name: 附带 data.db
      #   run: |
      #     mkdir -p sport-db/frontend/data
      #     cp sport-db/data/data.db sport-db/frontend/data/ 2>/dev/null || echo "data.db 尚不存在，跳过"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sport-db/frontend
          # 若仓库根就是 sport-db，则改为：path: frontend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
