# SportDB 每日同步：inbox 消费 → build data.db → 发布 Pages（task-6）
#
# == inbox 消费说明（写给下一个维护者）==
# PWA 前端（frontend/「今天」页）把用户新产生的东西先丢进 inbox/uploads/：
#   - 图片截图  inbox/uploads/YYYYMMDD-NNN.jpg|webp（前端已压 1280px，见 ai_image.py COMPRESS_SPEC）
#   - 轨迹文件  inbox/uploads/*.{gpx,tcx,kml}（手表/App 单次导出）
# 本工作流按以下规则消费 inbox（幂等，可重跑；失败进 quarantine/ 不阻塞）：
#   1. GPX/TCX/KML：scripts/parse_track.py 统一解析为 workouts schema，
#      去重键 start_time+type+distance（旧行被覆盖修正），原文件归档到
#      tracks/{gpx,tcx,kml}/YYYY/MM/，解析行追加进 data/workouts/<年>.csv。
#   2. 图片：Vision 模型配置（Settings → Secrets and variables → Actions）：
#      Variable VISION_ENDPOINT(…/chat/completions，必填)
#      + Variable VISION_MODEL(多模态模型名，必填)
#      + Secret LLM_API_KEY(免 Key 网关可不配；需 Key 的网关必填)；
#      scripts/ai_image.py --vision 得 JSON → --route 按 confidence 路由：
#        >= 0.8 直接写 data/workouts/<年>.csv + 原图归档 images/YYYY/MM/；
#        < 0.8  进 review/needs-review-*.json（原图一起移过去），PWA 标黄人工确认，build_db 会忽略 review。
#      缺任一件则图片留在 inbox 不动，并在 Summary 里提示缺什么。
#   3. 消费完的文件移走（归档），inbox 只留未处理项；data/ 变化触发 build_db 重编。
# 真相源 = git 里的 CSV + tracks + images；data.db 是构建产物（也进仓，方便直接下载查）。
#
# == 与 pages.yml 的分工 ==
# pages.yml：只动 frontend/ 时的快速预览发布（无数据步骤）。
# 本文件：inbox/data/scripts 变化 + 每天 cron 全量跑（消费→建库→发布），是数据正路。
# 两者发布目标同为 GitHub Pages，靠 `concurrency: group: pages` 串行，不会互踩。
name: sync

on:
  push:
    branches: [main]
    paths:
      # 仓库根 = sport-db 时的路径…
      - 'frontend/**'
      - 'data/**'
      - 'scripts/**'
      - 'inbox/**'
      - 'review/**'
      - 'reports/**'
      - '.github/workflows/sync.yml'
      # …以及 sport-db 作为子目录被 checkout 时的路径（双写，命中任一即跑）
      - 'sport-db/frontend/**'
      - 'sport-db/data/**'
      - 'sport-db/scripts/**'
      - 'sport-db/inbox/**'
      - 'sport-db/review/**'
      - 'sport-db/reports/**'
      - 'sport-db/.github/workflows/sync.yml'
  schedule:
    # 每天 06:30 北京时间跑一次：即使无 push，也生成日报占位检查 + 保证 Pages 数据新鲜
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（如：补跑某日 inbox）'
        required: false
        default: 'manual'

permissions:
  contents: write # 需要回写 data.db / 归档 tracks / 清空 inbox
  pages: write
  id-token: write

# 数据作业不抢跑：同一时刻只跑一个 sync（push 撞上 cron 时排队，不取消进行中的）
concurrency:
  group: sportdb-sync
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 兼容两种 checkout 布局：仓库根是 sport-db，或 sport-db 是子目录
      - name: 探测仓库布局
        id: layout
        run: |
          if [ -d "sport-db/frontend" ]; then PREFIX="sport-db"; else PREFIX="."; fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "repo prefix=$PREFIX"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- 1. inbox 消费：轨迹文件 ----------
      - name: 消费 inbox 轨迹 (gpx/tcx/kml)
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
        run: |
          INBOX="$PREFIX/inbox/uploads"
          mkdir -p "$INBOX" "$PREFIX/quarantine" "$PREFIX/data/workouts"
          shopt -s nullglob
          files=("$INBOX"/*.gpx "$INBOX"/*.GPX "$INBOX"/*.tcx "$INBOX"/*.TCX "$INBOX"/*.kml "$INBOX"/*.KML)
          if [ ${#files[@]} -eq 0 ]; then echo "inbox 无轨迹文件，跳过"; exit 0; fi
          echo "待消费轨迹：${#files[@]} 个"
          for f in "${files[@]}"; do
            base="$(basename "$f")"; ext="${base##*.}"; ext="$(echo "$ext" | tr '[:upper:]' '[:lower:]')"
            # 解析行先过一遍自检（parse 失败 → quarantine，不阻塞其它文件）
            if ! python3 "$PREFIX/scripts/parse_track.py" "$f" > /tmp/parse_out.txt 2>&1; then
              echo "PARSE FAIL: $base，移入 quarantine"; cat /tmp/parse_out.txt
              mv "$f" "$PREFIX/quarantine/$base"; continue
            fi
            cat /tmp/parse_out.txt
            # 从文件名/解析输出取年份（取不到则按当年），追加并去重进 data/workouts/<年>.csv
            year="$(grep -oE '20[0-9]{2}' <<< "$base" | head -1)"
            [ -z "$year" ] && year="$(date +%Y)"
            python3 "$PREFIX/scripts/parse_track.py" "$f" --out "$PREFIX/data/workouts/$year.csv"
            # 原文件归档 tracks/<fmt>/YYYY/MM/（月份取解析出的 start_beijing，取不到用当前月）
            month="$(grep -oE '20[0-9]{2}-[0-9]{2}' /tmp/parse_out.txt | head -1 | cut -d- -f2)"
            [ -z "$month" ] && month="$(date +%m)"
            dest="$PREFIX/tracks/$ext/$year/$month"
            mkdir -p "$dest"
            mv "$f" "$dest/$base"
            echo "归档 -> $dest/$base"
          done

      # ---------- 2. inbox 消费：图片截图（Vision → workouts） ----------
      # 模型三件套（仓库 Settings → Secrets and variables → Actions 里配）：
      #   Variable VISION_ENDPOINT ← OpenAI-compatible 地址，如 …/v1/chat/completions（必填）
      #   Variable VISION_MODEL     ← 模型名，chat/completions 能收 image_url 的多模态模型（必填）
      #   Secret   LLM_API_KEY     ← 需 Key 的网关才配；免 Key 网关（如当前）不用配
      - name: 消费 inbox 图片 (vision → workouts)
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
          VISION_ENDPOINT: ${{ vars.VISION_ENDPOINT }}
          VISION_API_KEY: ${{ secrets.LLM_API_KEY }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
        run: |
          INBOX="$PREFIX/inbox/uploads"
          shopt -s nullglob
          imgs=("$INBOX"/*.jpg "$INBOX"/*.jpeg "$INBOX"/*.png "$INBOX"/*.webp "$INBOX"/*.JPG "$INBOX"/*.PNG "$INBOX"/*.WEBP)
          if [ ${#imgs[@]} -eq 0 ]; then echo "inbox 无图片，跳过"; exit 0; fi
          # 免 Key 网关(如当前 VISION_ENDPOINT)允许空 Key: 只要求地址, Key 有则带、无则不带。
          if [ -z "$VISION_ENDPOINT" ]; then
            echo "::warning::VISION_ENDPOINT 未配置，${#imgs[@]} 张图片保留在 inbox，配好后自动消费（见本文件头注释）"
            exit 0
          fi
          # 长截图切片需 Pillow (tile_image), 装一次即可
          pip install -q pillow
          for f in "${imgs[@]}"; do
            base="$(basename "$f")"; stem="${base%.*}"
            # 调模型得 JSON（单图跑失败 → quarantine，不阻塞其它图）
            if ! python3 "$PREFIX/scripts/ai_image.py" --vision "$f" --out "/tmp/vision-$stem.json" > "/tmp/vision-log-$stem.txt" 2>&1; then
              echo "VISION FAIL: $base，移入 quarantine"; cat "/tmp/vision-log-$stem.txt"
              mv "$f" "$PREFIX/quarantine/$base"; continue
            fi
            cat "/tmp/vision-log-$stem.txt"
            # 按 confidence 路由：direct 入库 / review 人工确认
            route_out="$(python3 "$PREFIX/scripts/ai_image.py" --route "/tmp/vision-$stem.json" --workouts "$PREFIX/data/workouts" --review "$PREFIX/review" --images "$f")"
            echo "$route_out"
            # 原图归档：direct → images/YYYY/MM/，review → review/（图随 JSON 一起等人看）
            d="$(grep -oE '^20[0-9]{6}' <<< "$stem" | head -1)"
            if grep -q '^direct:' <<< "$route_out"; then
              y="${d:0:4}"; m="${d:4:2}"; [ -z "$y" ] && y="$(date +%Y)"; [ -z "$m" ] && m="$(date +%m)"
              dest="$PREFIX/images/$y/$m"; mkdir -p "$dest"; mv "$f" "$dest/$base"
              echo "归档 -> $dest/$base"
            else
              mv "$f" "$PREFIX/review/$base" 2>/dev/null || mv "$f" "$PREFIX/quarantine/$base"
              echo "$base -> review 待人工确认"
            fi
          done

      # ---------- 3. build data.db ----------
      - name: 合成 data.db (build_db)
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
        run: |
          python3 "$PREFIX/scripts/build_db.py" --data "$PREFIX/data" --out "$PREFIX/data.db"
          ls -lh "$PREFIX/data.db"
          # 单文件红线：data.db 必须 < 100MB（首年约几 MB，超了说明有大文件误入）
          size=$(stat -c%s "$PREFIX/data.db")
          if [ "$size" -gt 104857600 ]; then echo "::error::data.db 超 100MB ($size bytes)"; exit 1; fi

      # ---------- 4. nightly 日报 (task-8)：build_report.py，失败只 warning 不阻塞 ----------
      # 模型配置复用图片消费三件套：Variable VISION_ENDPOINT（必填）+ Variable VISION_MODEL（必填）
      # + Secret LLM_API_KEY（免 Key 网关可不配）。脚本缺失/模型未配/生成失败一律 warning 跳过，
      # 不阻塞后续回写与 Pages 发布；占位报告由脚本自己写（保证今日.md 永远有东西可展示）。
      - name: 生成 nightly 日报 (build_report)
        continue-on-error: true
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
          VISION_ENDPOINT: ${{ vars.VISION_ENDPOINT }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          VISION_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ ! -f "$PREFIX/scripts/build_report.py" ]; then
            echo "::warning::scripts/build_report.py 尚不存在（task-7 未合入），跳过日报生成"
            exit 0
          fi
          if [ -z "$VISION_ENDPOINT" ]; then
            echo "::warning::VISION_ENDPOINT 未配置，日报脚本将写占位报告（见脚本内占位逻辑）"
          fi
          # 以 $PREFIX 为 cwd 跑：脚本内 data/ 与 reports/ 相对路径在两种 checkout 布局下都正确
          cd "$PREFIX"
          python3 scripts/build_report.py || {
            echo "::warning::日报生成失败（build_report.py 非零退出），不阻塞后续回写与发布"
            exit 0
          }
          ls -lh reports/daily/ 2>/dev/null || echo "reports/daily 尚无文件（脚本可能只写了占位）"

      # ---------- 5. 回写：data.db + 归档 + 日报 + 清空的 inbox ----------
      - name: 回写数据变化
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
        run: |
          git config user.name "sportdb-bot"
          git config user.email "sportdb-bot@users.noreply.github.com"
          git add "$PREFIX/data.db" "$PREFIX/data" "$PREFIX/tracks" "$PREFIX/images" "$PREFIX/review" "$PREFIX/reports" 2>/dev/null || true
          # inbox 里被消费（已移走）的文件也要提交删除态
          git add -u "$PREFIX/inbox" 2>/dev/null || true
          if git diff --cached --quiet; then echo "无数据变化，无需回写"; exit 0; fi
          git commit -m "sync: inbox消费 + data.db 重编 + 日报 ($(date -u +%F))"
          # bot-poll 可能同时回写 offset: 先 rebase 再推, 3 次都推不上才认输。
          for i in 1 2 3; do
            git push && break
            echo "push 撞车, rebase 重试 ($i/3)"
            git pull --rebase origin main || { git rebase --abort; sleep 10; continue; }
            sleep 5
          done

      # ---------- 6. 给 Pages 准备前端产物（含离线数据 + 日报） ----------
      - name: 组装 Pages 产物
        env:
          PREFIX: ${{ steps.layout.outputs.prefix }}
        run: |
          # data.db 拷贝进前端产物：满足 app.js 首选候选 ../data.db（本地布局）与 ./data.db（Pages 布局）
          mkdir -p "$PREFIX/frontend/data/workouts"
          cp "$PREFIX/data.db" "$PREFIX/frontend/data.db"
          cp "$PREFIX/data/workouts/"*.csv "$PREFIX/frontend/data/workouts/" 2>/dev/null || echo "workouts CSV 尚无，跳过"
          # 日报拷贝进前端产物：满足 report.js 首选候选 ../reports（本地布局）与 ./reports（Pages 布局）
          if [ -d "$PREFIX/reports/daily" ]; then
            mkdir -p "$PREFIX/frontend/reports"
            cp -r "$PREFIX/reports/daily" "$PREFIX/frontend/reports/daily"
            echo "pages-include+=reports/daily（$(ls "$PREFIX/frontend/reports/daily" | wc -l) 个日报）"
          else
            echo "reports/daily 尚无，Pages 日报区将显示占位"
          fi
          ls -lh "$PREFIX/frontend/data.db"
          echo "pages-include=data.db + data/workouts/*.csv（CSV 供 httpvfs 失败时降级）"
          # 运行期不需要的目录不进 Pages（省配额）：raw 大分区/tracks 原轨迹/inbox 暂存一律排除
          rm -rf "$PREFIX/frontend/data/raw" "$PREFIX/frontend/tracks" 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.layout.outputs.prefix }}/frontend

  deploy-pages:
    needs: ingest-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages # 与 pages.yml 同组串行
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
